name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/smart_price_matcher?schema=public
      NEXTAUTH_SECRET: ci-only-secret-for-build-validation-32-characters
      ENABLE_PRICE_PERSISTENCE: "false"
      ENABLE_CONNECTOR_LOGS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx prisma validate
      - run: npm run build
