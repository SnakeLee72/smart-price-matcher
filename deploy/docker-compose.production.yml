services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to the built immutable image tag}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DEPLOY_ENV: production
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set a TLS PostgreSQL URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set a long random secret}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Set the public HTTPS URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set the public HTTPS URL}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Set a separate random admin token}
      ENABLE_PRICE_PERSISTENCE: "true"
      ENABLE_CONNECTOR_LOGS: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_ENTRA_ID_CLIENT_ID: ${MICROSOFT_ENTRA_ID_CLIENT_ID:-}
      MICROSOFT_ENTRA_ID_CLIENT_SECRET: ${MICROSOFT_ENTRA_ID_CLIENT_SECRET:-}
      MICROSOFT_ENTRA_ID_TENANT_ID: ${MICROSOFT_ENTRA_ID_TENANT_ID:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
